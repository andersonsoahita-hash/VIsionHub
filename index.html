<style>
/* Layout: navy sidebar + light workspace. Project page = header + tabs; overview is a dashboard (4 colour tiles, charts), budget is a set of editable sheets with a live summary. */
:root{
  --font-display:"Manrope","Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Onest","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#F3F5FB; --surface:#FFFFFF; --surface-2:#ECEFF9; --ink:#0D1330; --muted:#586184; --muted2:#A3AACB; --line:#DFE3F1; --hover:rgba(51,71,230,.09);
  --accent:#3347E6; --accent-ink:#FFFFFF; --accent-soft:#E4E8FF;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6;
  --good:#0A8765; --good-soft:#D9F3EA; --warn:#A85F00; --warn-soft:#FFEFD2; --bad:#C62F45; --bad-soft:#FDE3E8;
  --side-bg:#0A0F2E; --side-ink:#F1F3FF; --side-muted:#98A1CC; --side-active:#1B2468; --side-line:#1E2750;
  --cv-p:#FFE1E1; --cv-a:#FDEBDD; --cv-r:#FFF2C6; --cv-v:#D8F5E8; --cv-l:#E1EBFF; --cv-c:#DDD6FA; --cv-s:#E7DAFA; --cv-k:#E9EAF1;
  --shadow:0 1px 2px rgba(13,19,48,.05),0 10px 28px rgba(13,19,48,.06);
  --radius:16px; --bbh:68px;
  --gold:#C9A24B; --bb1:#07102E; --bb2:#0F1B5C;
  --bg2:#E3E8F6; --glow1:rgba(79,131,255,.22); --glow2:rgba(201,162,75,.20); --glow3:rgba(138,77,232,.15); --grid:rgba(51,71,230,.05);
}
@media all{:root:not([data-theme="light"]){
  --bg:#050A22; --surface:#0F1642; --surface-2:#171F4C; --ink:#EDF0FF; --muted:#9AA4CE; --muted2:#5C6694; --line:#232C5C; --hover:rgba(131,144,255,.14);
  --accent:#8390FF; --accent-ink:#0A0F2C; --accent-soft:#1E2768;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9;
  --good:#3DD6A5; --good-soft:#0F3B31; --warn:#F3B04C; --warn-soft:#41300C; --bad:#FF7F90; --bad-soft:#431620;
  --side-bg:#050819; --side-active:#161E55; --side-line:#161D45;
  --cv-p:#3A2330; --cv-a:#3A2D22; --cv-r:#383320; --cv-v:#1B3A30; --cv-l:#1E2C4D; --cv-c:#2B2750; --cv-s:#33264E; --cv-k:#22264A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --bg2:#0C1238; --glow1:rgba(79,110,255,.26); --glow2:rgba(201,162,75,.11); --glow3:rgba(138,77,232,.22); --grid:rgba(131,144,255,.055);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B1C; --surface:#10163A; --surface-2:#171F4C; --ink:#EDF0FF; --muted:#9AA4CE; --muted2:#5C6694; --line:#232C5C; --hover:rgba(131,144,255,.14);
  --accent:#8390FF; --accent-ink:#0A0F2C; --accent-soft:#1E2768;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9;
  --good:#3DD6A5; --good-soft:#0F3B31; --warn:#F3B04C; --warn-soft:#41300C; --bad:#FF7F90; --bad-soft:#431620;
  --side-bg:#050819; --side-active:#161E55; --side-line:#161D45;
  --cv-p:#3A2330; --cv-a:#3A2D22; --cv-r:#383320; --cv-v:#1B3A30; --cv-l:#1E2C4D; --cv-c:#2B2750; --cv-s:#33264E; --cv-k:#22264A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --bg2:#0C1238; --glow1:rgba(79,110,255,.26); --glow2:rgba(201,162,75,.11); --glow3:rgba(138,77,232,.22); --grid:rgba(131,144,255,.055);
  color-scheme:dark}
html[lang="zh"]{--font-body:"Onest","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;--font-display:"Manrope","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
html[lang="ja"]{--font-body:"Onest","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;--font-display:"Manrope","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif}
html[lang="ar"]{--font-body:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;--font-display:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
html[lang="hi"]{--font-body:"Onest","Noto Sans Devanagari","Nirmala UI","Mangal",sans-serif;--font-display:"Manrope","Noto Sans Devanagari","Nirmala UI","Mangal",sans-serif}
html[lang="ar"] *{letter-spacing:0!important}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(24px,3vw,32px);line-height:1.15;font-weight:800}
h2{font-size:16.5px;font-weight:700;line-height:1.25}
h3{font-size:15.5px;font-weight:700}
p{margin:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:6px}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{min-height:100vh}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - var(--bbh))}
.side{position:sticky;top:calc(var(--bbh) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bbh));height:calc(100dvh - var(--bbh) - env(safe-area-inset-top,0px));align-self:start;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:22px 12px 16px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px}
.brand b{display:block;font-family:var(--font-display);font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;color:var(--side-muted);font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:var(--side-muted);font-weight:500;text-align:start;cursor:pointer;min-width:0}
.nav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--side-ink)}
.nav .addp{border:1px dashed var(--side-line);margin-top:4px}
.side-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:0 12px 6px}
.side-bot{margin-top:auto}
.side-foot{display:flex;flex-direction:column;gap:10px;padding:0 4px}
.side-foot select{background:var(--side-active);border:1px solid var(--side-line);color:var(--side-ink);border-radius:10px;padding:9px 10px}
.side-foot p{font-size:12px;color:var(--side-muted);line-height:1.5}
.lang-row{display:flex;align-items:center;gap:10px;color:var(--side-muted)}
.lang-row select{flex:1;min-width:0}

.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);;border-block-end:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
.topbar-in .ttl{font-family:var(--font-display);font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{margin-inline-start:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saved .ic{width:14px;height:14px;color:var(--good)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer}
.scrim{display:none}
.content{max-width:1360px;margin-inline:auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px))}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block-end:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.tight{gap:2px;flex-wrap:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gridA{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.split2{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}
.sticky{position:sticky;top:76px}
.lead{color:var(--muted);max-width:68ch}
.sech{margin-block-end:10px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.45}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn.full{width:100%;margin-top:12px}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn .ic{width:16px;height:16px}
.lnk{border:0;background:none;padding:0;cursor:pointer;text-align:start;font-weight:700;color:inherit}
.lnk:hover{color:var(--accent)}
.flip{transform:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

.hello{display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.tile .v{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:13px;margin-top:2px}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.pcard h3{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv span{display:block;color:var(--muted);font-size:12px}
.kv b{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.pspark{color:var(--c1);height:46px}
.spark{width:100%;height:100%;display:block}
.dots{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.solid{background:var(--good)}.dot.verify{background:var(--warn)}.dot.fragile{background:var(--bad)}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:36px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.emptyc{display:flex;flex-direction:column;align-items:flex-start;gap:10px;justify-content:center}
.emptyc .ic{width:30px;height:30px;color:var(--accent)}

.phead{display:flex;flex-direction:column;gap:10px}
.name-input{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;border:0;border-block-end:2px solid transparent;border-radius:0;background:transparent;padding:2px 0;width:100%}
.name-input:hover,.name-input:focus{border-block-end-color:var(--line);outline:none}
.name-input:focus-visible{border-block-end-color:var(--accent)}
.chips{gap:8px}
.chip,.chip-sel{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;width:auto}
.chip-sel{padding-inline-end:8px;cursor:pointer}
.chip .ic{width:14px;height:14px;color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-block-end:1px solid var(--line);scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:11px 14px;border:0;border-block-end:2px solid transparent;margin-block-end:-1px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-block-end-color:var(--accent)}
.tab .ic{width:17px;height:17px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-weight:600;font-size:13.5px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input[type="checkbox"]{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
input[type="range"]{padding:0;border:0;background:transparent;accent-color:var(--c1);height:24px}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;min-height:130px}
.field .cell{border:1px solid var(--line);border-radius:10px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-solid{background:var(--good-soft);color:var(--good)}
.p-verify{background:var(--warn-soft);color:var(--warn)}
.p-fragile{background:var(--bad-soft);color:var(--bad)}
.p-unknown{background:var(--surface-2);color:var(--muted)}
.dimrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:10px 0;border-block-end:1px solid var(--line);align-items:center}
.dimrow:last-of-type{border-block-end:0}
.dimrow .why{grid-column:1/-1;color:var(--muted);font-size:13px}

/* overview */
.kts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kt{position:relative;overflow:hidden;color:#fff;border-radius:var(--radius);padding:18px 18px 16px;min-height:128px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kt-l{font-size:13px;font-weight:600;opacity:1}
.kt-v{font-family:var(--font-display);font-size:clamp(22px,2.2vw,30px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kt-s{font-size:12.5px;opacity:.95}
.kt-sp{position:absolute;inset-inline-end:14px;bottom:12px;width:44%;height:34px;color:#fff;opacity:.6}
.k1{background:linear-gradient(135deg,#2336C0,#3F66F2)}
.k2{background:linear-gradient(135deg,#0A6850,#0C8566)}
.k3{background:linear-gradient(135deg,#5A30C6,#7C50E8)}
.k4{background:linear-gradient(135deg,#9E390D,#C24A15)}
.setup-in{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chk-b{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px}
.chk-b:hover{border-color:var(--accent)}
.chk-b .cb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted2);display:grid;place-items:center}
.chk-b.done{color:var(--muted)}
.chk-b.done .cb{background:var(--good);border-color:var(--good);color:#fff}
.chk-b .cb .ic{width:11px;height:11px;stroke-width:3}
.chart{direction:ltr}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted2);stroke-width:1.2}
.chart .ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .l1{stroke:var(--c1)}.chart .l2{stroke:var(--c2)}.chart .l3{stroke:var(--c3)}
.chart .dsh{stroke-dasharray:6 4}
.chart .area{fill:var(--c1);opacity:.13}
.chart .b1{fill:var(--c1)}.chart .b2{fill:var(--c2)}.chart .bp{fill:var(--good)}.chart .bn{fill:var(--bad)}
.chart .mk{fill:var(--surface);stroke:var(--c1);stroke-width:2.5}
.chart text.mkl{fill:var(--ink);font-weight:700;font-size:11.5px}
.chart .dash{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1.2}
.chart .hit:hover{fill:var(--hover)}
.chart.sm svg{max-height:150px}
.axis-n{font-size:11.5px;color:var(--muted);text-align:end;margin-top:-2px}
.leg{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.leg i+i,.leg i:not(:first-child){margin-inline-start:8px}
.lg1{background:var(--c1)}.lg2{background:var(--c2)}.lg3{background:var(--c3)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:8px;background:var(--c1)}
.sw.l2{background:var(--c2)}.sw.l3{background:var(--c3)}
.donut{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut svg{width:190px;height:190px;flex:none}
.donut .dc1{font-family:var(--font-display);font-size:19px;font-weight:800;fill:var(--ink)}
.donut .dc2{font-size:11px;fill:var(--muted)}
.dleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px}
.dleg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.dleg i{width:12px;height:12px;border-radius:3px}
.dleg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg b{font-variant-numeric:tabular-nums}
.nrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-block-end:1px solid var(--line);font-size:14px}
.nrow:last-child{border-block-end:0}
.late{color:var(--bad);font-weight:700;font-size:12.5px}
.prow{display:flex;justify-content:space-between;margin-block-end:6px;font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* sheets */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.sheet{min-width:520px}
.sheet th{padding:8px 10px;text-align:start;font-size:12px;font-weight:600;color:var(--muted);border-block-end:1px solid var(--line);white-space:nowrap}
.sheet th.n,.sheet td.n{text-align:end}
.sheet td{padding:0;border-block-end:1px solid var(--line);vertical-align:middle}
.sheet td.n,.sheet td.calc{padding:0 10px;white-space:nowrap}
.sheet td.calc{color:var(--muted)}
.sheet .x{width:40px;text-align:center;padding:0 4px}
.sheet tfoot td{font-weight:700;padding:10px;border-block-end:0;background:var(--surface-2)}
.sheet tfoot td:first-child{border-start-start-radius:10px;border-end-start-radius:10px}
.sheet tfoot td:last-child{border-start-end-radius:10px;border-end-end-radius:10px}
.sheet tr.sub td{padding:12px 10px 6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:transparent}
.sheet.cmp td{padding:11px 10px}
.sheet.cmp td.neg{color:var(--bad);font-weight:600}
.sheet tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.cell{width:100%;border:0;border-radius:0;background:transparent;padding:10px;min-width:90px}
.cell.num{text-align:end;font-variant-numeric:tabular-nums;min-width:96px}
.cell.sel{min-width:110px;cursor:pointer}
.cell:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft);border-radius:6px}
.cell::placeholder{color:var(--muted2)}
input[type="date"].cell{min-width:130px}
.triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:6px 6px 0}
.triple label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.triple .cell{border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
td.loanrow{padding:4px 4px 10px!important}
td.loanrow .hint{padding:8px 8px 0}
.cellta{min-height:70px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:12px}
.kvs>div{background:var(--surface-2);border-radius:12px;padding:10px 14px}
.kvs span{display:block;color:var(--muted);font-size:12px}
.kvs b{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.kvs.v{grid-template-columns:1fr 1fr}
.quads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-block:12px}
.quad{display:flex;flex-direction:column;gap:2px;text-align:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.quad .big{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;color:var(--muted)}
.quad b{font-size:13.5px}
.quad[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.quad[aria-pressed="true"] .big{color:var(--accent)}
.tests{display:flex;flex-direction:column;gap:8px;margin-block-end:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk span{padding-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg.wrap{flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.ok[aria-pressed="true"]{background:var(--good);color:#fff}
.seg button.ko[aria-pressed="true"]{background:var(--bad);color:#fff}
.seg.sm button{padding:5px 10px;min-width:34px;display:inline-grid;place-items:center}
.seg.sm .ic{width:14px;height:14px}
.score{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:8px;font-weight:800;font-size:13px;margin-inline:10px}
.score.l{background:var(--good-soft);color:var(--good)}.score.m{background:var(--warn-soft);color:var(--warn)}.score.h{background:var(--bad-soft);color:var(--bad)}
.hb{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.hbr{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px}
.hbr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr b{font-variant-numeric:tabular-nums}

/* canvas */
.cv{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-areas:"p p a a v v r r s s" "p p k k v v c c s s" "o o o o o w w w w w";gap:10px}
.cvbox{display:flex;flex-direction:column;gap:6px;border-radius:18px;padding:14px 14px 10px;min-height:150px;min-width:0}
.cvbox label{font-family:var(--font-display);font-weight:800;font-size:14.5px}
.cvbox textarea{flex:1;border:0;background:transparent;resize:none;padding:2px 0;min-height:90px;font-size:14px;line-height:1.6;border-radius:0}
.cvbox textarea:focus{outline:none;background:color-mix(in srgb,var(--surface) 45%,transparent)}
.cvbox:focus-within{box-shadow:0 0 0 2px var(--accent)}
.cvbox textarea::placeholder{color:var(--muted);opacity:.6}
.c-partners{grid-area:p;background:var(--cv-p)}.c-activities{grid-area:a;background:var(--cv-a)}.c-resources{grid-area:k;background:var(--cv-r)}
.c-value{grid-area:v;background:var(--cv-v)}.c-relations{grid-area:r;background:var(--cv-l)}.c-channels{grid-area:c;background:var(--cv-c)}
.c-segments{grid-area:s;background:var(--cv-s)}.c-costs{grid-area:o;background:var(--cv-k)}.c-revenue{grid-area:w;background:var(--cv-k)}

/* scenarios */
.sls{display:flex;flex-direction:column;gap:6px;margin-block:16px 10px}
.slrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:8px 0;border-block-end:1px solid var(--line)}
.slrow label{font-weight:600;font-size:13.5px}
.slrow input{grid-column:1/-1;order:3}
.slrow b{font-variant-numeric:tabular-nums;font-size:13.5px}
.imp{font-size:12.5px;font-weight:700;min-width:70px;text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.imp.neg{color:var(--bad)}.imp.pos{color:var(--good)}
.sens{display:flex;flex-direction:column;gap:10px}
.sens-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 130px;gap:12px;align-items:center;font-size:13.5px}
.sens-row .bar i{background:var(--c2)}
.sens-row b{font-variant-numeric:tabular-nums;text-align:end}

/* plan */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kn{background:var(--surface);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px}
.kcard.late-c{border-color:var(--bad)}
.kcard .cell{min-width:0;border-radius:8px}
.kcard>.cell{font-weight:600}
.kmeta{display:grid;grid-template-columns:1.1fr 1fr;gap:4px}
.kfoot{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.kadd{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:10px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.kadd:hover{border-color:var(--accent);color:var(--accent)}
.firstr{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-block-end:1px solid var(--line)}
.firstr:last-of-type{border-block-end:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface-2);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-family:var(--font-display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* file */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;color:var(--muted);background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:28px;height:28px}
.drop b{color:var(--ink)}

.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lang{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:start}
.lang b{font-size:16px}.lang span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lang[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.book{display:flex;flex-direction:column;gap:8px}
.book .au{color:var(--muted);font-size:13px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;opacity:0;transform:translateY(8px);transition:.2s}
.toast.on span{opacity:1;transform:none}
.tip{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 11px;border-radius:9px;font-size:12.5px;line-height:1.45;white-space:pre-line;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.tip[hidden]{display:none}

@media (max-width:1100px){
  .split,.split2{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .gridA{grid-template-columns:minmax(0,1fr)}
  .kts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:288px;height:100dvh;z-index:40;transform:translateX(-102%);transition:transform .22s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  [dir="rtl"] .side{transform:translateX(102%)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(5,8,25,.5);z-index:35}
  .menu-btn{display:grid}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kan{grid-template-columns:minmax(0,1fr)}
  .quads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cv{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:none}
  .cv .cvbox{grid-area:auto}
  .cv .c-value,.cv .c-costs,.cv .c-revenue{grid-column:1/-1}
  .sens-row{grid-template-columns:minmax(0,1fr) auto}
  .sens-row .bar{grid-column:1/-1;order:3}
}
@media (max-width:520px){
  .card{padding:14px}
  .projects{grid-template-columns:minmax(0,1fr)}
  .kts{gap:10px}
  .kt{padding:14px;min-height:112px}
  .triple{grid-template-columns:minmax(0,1fr)}
  .hbr{grid-template-columns:minmax(60px,100px) minmax(0,1fr) auto}
  .cv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.grid2,.grid3{align-items:start}
.sheet th:first-child{min-width:200px}
.sheet td:first-child .cell{min-width:200px}
.gridA{align-items:stretch}.gridA>.card:first-child .chart{min-height:300px}

/* ---- Simulateur de marché ---- */
.gmrules{display:grid;gap:8px;margin-top:12px}
.gmrules div{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px}
.gmrules .ic{width:16px;height:16px;flex:none;margin-top:3px;color:var(--good)}
.gmopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:12px}
.gmseed{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.gmgo{gap:12px;flex-wrap:wrap;align-items:center}
.gmverd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.gmkv{margin-top:14px}
.gmkv .kvi b{display:block;margin:2px 0}
.gmkv .kvi .hint{display:block;font-size:12px}
.gmbig{font-size:24px;margin:6px 0 4px}
.gmn{border:1px solid var(--line);border-inline-start:4px solid var(--muted2);border-radius:12px;padding:12px 14px;margin-block:10px;background:var(--surface)}
.gmn.bad{border-inline-start-color:var(--bad)}.gmn.good{border-inline-start-color:var(--good)}.gmn.warn{border-inline-start-color:var(--warn)}.gmn.ch{border-inline-start-color:var(--accent)}
.gmn.neu{opacity:.75}
.gmn-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.gmn p{margin:4px 0 8px;font-size:14px;max-width:72ch}
.gmacc{margin-top:4px}
.sheet td.pn{padding:9px 10px;min-width:160px}
.sheet td.pn small{display:block;color:var(--muted);font-size:12px}
.sheet td.num{padding:0 10px;text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet td.gmd{padding:6px 10px;white-space:nowrap}
.sheet td.gmd small{display:block;color:var(--muted);font-size:12px}
.gmt td:nth-child(2) .cell,.gmt td:nth-child(4) .cell{min-width:110px}
.gmt td:first-child .cell{min-width:0}
.gmprev{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:6px 14px}
.gmprev .warn-box{margin:8px 0}
.gmtot{border-block-start:2px solid var(--line);font-size:15px}
.gmwhy{margin:10px 0 0;padding-inline-start:18px;font-size:14px;display:grid;gap:6px}
.gmme td{background:var(--accent-soft)}
.gmbul{display:grid;gap:14px;margin-top:10px}
.gmbr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.gmbr .bar,.gmbr .hint{grid-column:1/-1}
.gmbs{font-family:var(--font-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.gmnw{min-width:150px;font-size:13px;color:var(--muted)}
.gmh td{padding:8px 10px}
.chart .fan{fill:var(--c1);opacity:.14}
.chart .gmed{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:2 3}
.chart .pl{stroke:var(--muted2);stroke-dasharray:6 4;stroke-width:2;fill:none}
.leg .pl-l,.leg .gm-plb{background:transparent;border-block-start:2px dashed var(--muted2);height:0;width:16px;border-radius:0;align-self:center}
.gmacts{gap:10px;flex-wrap:wrap}
@media (max-width:760px){
  .sheet td.pn{min-width:130px}
  .gmbig{font-size:20px}
}

.gmin{display:inline;color:var(--accent);font-weight:600;margin-inline-start:4px}
.gmrep .sheet th:first-child,.gmstk th:first-child{min-width:0}
@media (max-width:760px){
  .gmstk{display:block;min-width:0!important;width:100%}
  .gmstk thead{display:none}
  .gmstk tbody{display:grid;gap:10px}
  .gmstk tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
  .gmstk td{display:block;padding:0!important;border:0;text-align:start!important;min-width:0!important}
  .gmstk td.pn{grid-column:1/-1;padding:0 0 4px!important}
  .gmstk td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}

}

/* ===== Immersive shell: horizontal brand bar + layered background ===== */
body::after{display:none}
body{background:#050A22}
.brandbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;height:var(--bbh);color:#fff;
 background:linear-gradient(100deg,var(--bb1),var(--bb2) 62%,#16206F);border-block-end:1px solid rgba(201,162,75,.45);box-shadow:0 8px 30px rgba(7,16,46,.28)}
.brandbar::after{content:"";position:absolute;inset:auto 0 -1px 0;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 30%,#4F83FF 70%,transparent);opacity:.9}
.bb-in{height:100%;max-width:1680px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}

.bb-word{font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1}

.bb-by-off{display:flex;flex-direction:column;gap:1px;border-inline-start:1px solid rgba(255,255,255,.22);padding-inline-start:12px;line-height:1.2}
.bb-by b{font-size:12.5px;font-weight:700;color:#fff}.bb-by i{font-style:normal;font-size:11.5px;color:#AEB8E6}
.bb-l{display:flex;align-items:center;gap:12px;min-width:0}

.bb-nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.bb-nav button[aria-current="page"]{background:linear-gradient(135deg,#E8C877,var(--gold));color:#1A1405;box-shadow:0 3px 12px rgba(201,162,75,.35)}

.nav-main{display:none}

@media (max-width:1240px){.bb-nav button span{display:none}.bb-nav button{padding:9px 12px}}

@media (max-width:900px){
 .bb-in{gap:8px}.bb-nav{display:none}.nav-main{display:flex}.brandbar .menu-btn{display:grid}.bb-word{font-size:27px}
}

/* ===== Stephen Group ===== */
.ghero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;padding:32px;border-radius:22px;color:#fff;position:relative;overflow:hidden;border:1px solid rgba(201,162,75,.4);box-shadow:var(--shadow);
 background:radial-gradient(620px 320px at 92% -10%,rgba(201,162,75,.34),transparent 62%),radial-gradient(520px 320px at -4% 110%,rgba(79,131,255,.32),transparent 60%),linear-gradient(135deg,#0B2545,#0A1240 72%)}
.ghero h1{color:#fff;font-size:clamp(30px,4.2vw,46px);letter-spacing:-.03em;margin-block:6px 10px}
.ghero p{color:rgba(255,255,255,.82);max-width:60ch}
.geye{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#E8C877}
.ghow{list-style:none;counter-reset:h;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-self:center}
.ghow li{counter-increment:h;display:flex;gap:12px;align-items:flex-start;font-size:14px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 14px}
.ghow li::before{content:counter(h);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:var(--gold);color:#1A1405}
.gtool{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;padding:14px 18px}
.gtool-g{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gtool-g>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.gnav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:calc(var(--bbh) + env(safe-area-inset-top,0px) + 8px);z-index:12;padding:6px;border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto;
 background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);box-shadow:var(--shadow)}
.gnav button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.gnav button:hover{background:var(--accent-soft);color:var(--accent)}
.gstack{gap:26px}
.gsec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:calc(var(--bbh) + 70px);min-width:0}
.gsec-h h2{font-size:20px}.gsec-h p{max-width:78ch;margin-top:3px;font-size:14px}
.gks{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.gk{--c:var(--c1);position:relative;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 16px 22px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.gk::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--c)}
.gk.c1{--c:var(--c3)}.gk.c2{--c:var(--gold)}.gk.c3{--c:var(--c6)}.gk.c4{--c:var(--c1)}.gk.c5{--c:var(--c2)}.gk.c6{--c:#64748B}.gk.c7{--c:var(--c4)}.gk.c8{--c:var(--c5)}
.gk.bad{--c:var(--bad)}.gk.bad .gk-v{color:var(--bad)}
.gk-l{font-size:12.5px;font-weight:600;color:var(--muted)}
.gk-v{font-family:var(--font-display);font-size:clamp(22px,2.3vw,30px);font-weight:800;line-height:1.15;margin-block:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.gk-s{font-size:12.5px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);max-width:80ch}
.gphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.gph{position:relative;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:5px;overflow:hidden;min-width:0;border-block-start:3px solid var(--gold)}
.gph-n{position:absolute;inset-inline-end:12px;top:-6px;font-family:var(--font-display);font-size:64px;font-weight:800;color:var(--accent);opacity:.09;line-height:1}
.gph h3{font-size:14.5px;padding-inline-end:30px}.gph-s,.gph-d{font-size:12.5px;color:var(--muted)}.gph-d{color:var(--ink);font-weight:600}
.gph-u{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.gdot{--c:#888;display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}.gdot.off{background:transparent;box-shadow:inset 0 0 0 2px var(--c);opacity:.6}
.gcard{padding:18px}
.gg-scroll{overflow-x:auto}
.gg{--lab:250px;min-width:760px;position:relative}
.gg-head{display:grid;grid-template-columns:var(--lab) minmax(0,1fr)}
.gg-axis{position:relative;height:22px}.gg-axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gg-body{position:relative}
.gg-mks{position:absolute;inset:0 0 0 var(--lab);pointer-events:none;z-index:3}
.gg-mks i{position:absolute;top:0;bottom:0;width:0;border-inline-start:2px dashed var(--gold)}
.gg-mks i.mk-f{border-color:var(--c6)}.gg-mks i.mk-a{border-color:var(--good)}
.gg-mks b{position:absolute;top:2px;inset-inline-start:5px;font-size:10.5px;font-weight:700;white-space:nowrap;padding:1px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.gg-mks i.mk-f b{top:24px}.gg-mks i.mk-a b{top:46px}
.gg-ph{padding:14px 0 5px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-block-start:1px solid var(--line);margin-block-start:6px}
.gg-ph:first-child{border:0;margin:0}
.gg-row{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);align-items:center;cursor:pointer;border-radius:8px}
.gg-row:hover,.gg-row.sel{background:var(--hover)}
.gg-lab{display:flex;gap:8px;align-items:center;padding:4px 10px 4px 4px;min-width:0;font-size:13px}
.gg-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gg-trk{position:relative;height:26px;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--yrs)) 100%}
.gb{position:absolute;top:7px;height:12px;border-radius:4px}
.gb.prep{background:repeating-linear-gradient(135deg,var(--c) 0 4px,color-mix(in srgb,var(--c) 30%,transparent) 4px 8px)}
.gb.ramp{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 35%,transparent),var(--c))}
.gb.mat{background:var(--c)}
.gb.wait{top:12px;height:2px;background:repeating-linear-gradient(90deg,var(--muted2) 0 3px,transparent 3px 6px)}
.gg-no{position:absolute;inset-inline-start:6px;top:5px;font-size:12px;color:var(--muted2);font-style:italic}
.glegend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.gline{display:inline-block;width:22px;border-block-start:2px solid var(--ink)}
.gchart{width:100%;height:auto;display:block}.gl{stroke:var(--line);stroke-width:1}.gtx{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.gnet{stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.gtab{min-width:0!important}
.gurow{cursor:pointer}.gurow.sel td{background:var(--accent-soft)}
.gtab small{font-size:11.5px}.gtab td.calc{white-space:nowrap}
.gtab tr.gfree td{background:color-mix(in srgb,var(--gold) 22%,transparent);font-weight:700}
.gtab td.gcur,.gtab th.gcur{background:color-mix(in srgb,var(--accent-soft) 70%,transparent);font-weight:700}
.gsal-ft{margin-top:12px;justify-content:space-between}
.gform{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px 16px;margin-top:6px}
.gfield{display:flex;flex-direction:column;gap:4px;min-width:0}.gfield>span{font-size:12px;font-weight:600;color:var(--muted)}
.gfield .cell{border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.gfield.inl{flex-direction:row;align-items:center;gap:10px}.gfield.inl .cell{width:90px}
.gfield.chk{flex-direction:row;align-items:center;gap:9px;align-self:end;padding-bottom:10px}
.gdet{border-color:var(--gold);border-width:1.5px;margin-top:14px;scroll-margin-top:calc(var(--bbh) + 20px)}
.gcurve{display:flex;align-items:center;gap:14px;margin-top:14px;color:var(--c3)}.gcurve .spark{width:320px;max-width:100%;height:48px}
.gsub{margin-block:20px 6px}
@media (max-width:900px){
 .ghero{grid-template-columns:minmax(0,1fr);padding:22px}
 .gg{--lab:150px;min-width:640px}
 .gnav{border-radius:16px}
}

/* ===== Home ===== */
.home{min-height:calc(100vh - var(--bbh) - 90px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:44px;padding-block:20px 30px;position:relative}
.home-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.home-logo svg{width:92px;height:92px;filter:drop-shadow(0 12px 30px rgba(79,131,255,.45))}
.home-word{font-size:clamp(52px,9vw,104px);font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:8px}
.home-word em{font-style:normal;background:linear-gradient(120deg,#E8C877,#C9A24B 60%,#B8892F);-webkit-background-clip:text;background-clip:text;color:transparent}
.home-by{font-size:15px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.home-tag{font-size:clamp(16px,2vw,20px);color:var(--muted);margin-top:6px}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;width:100%;max-width:1080px}
.door{position:relative;text-align:start;display:flex;flex-direction:column;gap:8px;padding:24px 22px 22px;border-radius:22px;border:1px solid var(--line);cursor:pointer;color:var(--ink);
 background:linear-gradient(160deg,color-mix(in srgb,var(--surface) 94%,transparent),color-mix(in srgb,var(--surface-2) 90%,transparent));box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;min-height:190px}
.door:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 18px 44px rgba(13,19,48,.18)}
.door-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0B2545,#16206F);color:#E8C877}
.door-ic .ic{width:22px;height:22px}
.door b{font-family:var(--font-display);font-size:19px;margin-top:6px}.door small{font-size:13.5px;color:var(--muted);line-height:1.45}
.door-n{position:absolute;top:18px;inset-inline-end:18px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
@media (max-width:1000px){.doors{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.doors{grid-template-columns:minmax(0,1fr)}.door{min-height:0}}

/* ===== One project at a time ===== */
.pj-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.pjw{max-width:1000px;margin-inline:auto}
.pj-stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.pj-arrow{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.pj-arrow:hover:not(:disabled){border-color:var(--gold);color:var(--accent)}.pj-arrow:disabled{opacity:.3;cursor:default}
.pj-card{display:flex;flex-direction:column;gap:18px;padding:34px;border-radius:26px;border:1px solid var(--line);min-width:0;box-shadow:var(--shadow);
 background:radial-gradient(500px 240px at 100% 0,color-mix(in srgb,var(--gold) 14%,transparent),transparent 70%),color-mix(in srgb,var(--surface) 94%,transparent)}
.pj-card h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.025em}
.pj-count{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pj-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.pj-k{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}.pj-k span{font-size:12.5px;color:var(--muted)}.pj-k b{font-family:var(--font-display);font-size:20px}.pj-k b.neg{color:var(--bad)}
.pj-spark{color:var(--accent)}.pj-spark .spark{width:100%;height:90px}
.pj-dots{display:flex;gap:9px;justify-content:center}
.pj-dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--muted2);cursor:pointer;padding:0}.pj-dots button[aria-current="true"]{background:var(--gold);width:26px;border-radius:6px}
@media (max-width:700px){.pj-stage{grid-template-columns:minmax(0,1fr)}.pj-arrow{display:none}.pj-card{padding:22px}.pj-dots button{width:12px;height:12px}}

/* ===== Gate ===== */
.gate{min-height:calc(100vh - var(--bbh) - 120px);display:grid;place-items:center}
.gate-card{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;padding:34px 30px;border-radius:26px;color:#fff;border:1px solid rgba(201,162,75,.45);box-shadow:0 30px 80px rgba(7,16,46,.4);
 background:radial-gradient(420px 220px at 90% -10%,rgba(201,162,75,.3),transparent 62%),linear-gradient(150deg,#0B2545,#0A1240)}
.gate-card h2{color:#fff;font-size:26px}.gate-card p{color:rgba(255,255,255,.8);font-size:14px}.gate-note{font-size:12px!important;color:rgba(255,255,255,.55)!important}
.gate-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(201,162,75,.18);color:#E8C877}.gate-ic .ic{width:26px;height:26px}
.gate-card .cell{border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;padding:13px 14px}
.gate-card .cell::placeholder{color:rgba(255,255,255,.5)}
.gate-card .btn.primary{background:linear-gradient(135deg,#E8C877,#C9A24B);border-color:#C9A24B;color:#1A1405}
.gate-card .btn.ghost{color:#fff}.gate-card .lnk{color:#E8C877;align-self:flex-start}
.gate-err{background:rgba(255,127,144,.16);border:1px solid rgba(255,127,144,.5);color:#FFC2CB;padding:9px 12px;border-radius:10px;font-size:13px}
.gate-card .warn-box{color:var(--ink)}
.shake{animation:shk .35s}@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ===== Group tabs, map, companies ===== */
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}.ghead h1{font-size:clamp(32px,4.4vw,48px);letter-spacing:-.03em}
.ghead .geye{color:var(--gold)}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto;background:linear-gradient(135deg,#0B2545,#0F1B5C);border:1px solid rgba(201,162,75,.4);box-shadow:var(--shadow)}
.gtabs button{border:0;background:transparent;color:#C3CBF0;font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap}
.gtabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
.gtabs button[aria-pressed="true"]{background:linear-gradient(135deg,#E8C877,#C9A24B);color:#1A1405}
.gmap-scroll{overflow-x:auto;padding-bottom:6px}.gmap{display:block;max-width:none}
.gn{cursor:pointer}.gn-bg{fill:var(--surface);stroke:var(--line);stroke-width:1.2}.gn:hover .gn-bg,.gn:focus .gn-bg{stroke:var(--gold);stroke-width:2}
.gn.off .gn-bg{fill:var(--surface-2)}.gn-t{font-size:12px;font-weight:700;fill:var(--ink)}.gn-s{font-size:10.5px;fill:var(--muted)}
.gn-h rect{fill:#0B2545;stroke:#C9A24B;stroke-width:2}.gh-t{font-size:15px;font-weight:800;fill:#fff}.gh-s{font-size:11px;fill:#E8C877}
.cogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.coc{--c:#888;text-align:start;display:flex;flex-direction:column;gap:7px;padding:18px;border-radius:18px;border:1px solid var(--line);cursor:pointer;color:var(--ink);position:relative;overflow:hidden;min-width:0;
 background:linear-gradient(160deg,color-mix(in srgb,var(--c) 12%,var(--surface)),color-mix(in srgb,var(--surface) 94%,transparent));box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.coc::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--c)}
.coc:hover{transform:translateY(-3px);border-color:var(--c)}
.coc-d{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}.coc b{font-family:var(--font-display);font-size:16.5px}
.coc-w{font-size:13px;color:var(--muted);line-height:1.45}.coc-s{font-size:12px;font-weight:600;margin-top:auto;padding-top:4px}

/* ===== Company page ===== */
.gunit{max-width:1100px;margin-inline:auto;width:100%}
.uhero{position:relative;overflow:hidden;color:#fff;padding:38px 34px;border-radius:26px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);
 background:radial-gradient(520px 260px at 95% -20%,rgba(255,255,255,.25),transparent 62%),linear-gradient(135deg,color-mix(in srgb,var(--c) 88%,#000),color-mix(in srgb,var(--c) 35%,#0A1240))}
.uhero .geye{color:rgba(255,255,255,.85)}.uhero p{color:rgba(255,255,255,.88);margin-top:6px;font-weight:600}
.uname{display:block;width:100%;border:0;background:transparent;color:#fff;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.2vw,46px);letter-spacing:-.03em;margin-top:8px;padding:0;outline-offset:6px}
.uwhy{padding:26px 30px;border-radius:22px;border:1px solid var(--line);border-inline-start:6px solid var(--c);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 10%,var(--surface)),color-mix(in srgb,var(--surface) 94%,transparent));box-shadow:var(--shadow)}
.uwhy .geye{color:var(--c);font-size:13px;letter-spacing:.3em}
.ugrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.wcard{padding:20px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:var(--shadow);border-block-start:3px solid var(--c);min-width:0;display:flex;flex-direction:column;gap:8px}
.wcard h3{font-size:14px;color:var(--c);text-transform:uppercase;letter-spacing:.07em}
.gta{width:100%;resize:vertical;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;line-height:1.6;padding:6px 8px;margin-inline:-8px;width:calc(100% + 16px)}
.gta.big{font-family:var(--font-display);font-size:clamp(17px,2vw,21px);font-weight:600;line-height:1.5}
.gta:hover{border-color:var(--line)}.gta:focus{border-color:var(--accent);background:var(--surface)}
.gchips{display:flex;gap:8px;flex-wrap:wrap}
.gchip{--c:#888;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.gchip small{color:var(--muted);font-weight:500}.gchip:hover{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
@media (max-width:900px){.ugrid{grid-template-columns:minmax(0,1fr)}.uhero{padding:26px 22px}.gtabs{border-radius:18px}}

.warn-box{padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:14px;font-weight:500}
.gcurve .spark{width:100%;max-width:640px;height:70px}
.gta{field-sizing:content;min-height:3.2em}
.uname{font-size:clamp(22px,4.2vw,46px);text-overflow:ellipsis}
@media (max-width:600px){.uname{font-size:22px}}

/* ===== Living background (cheap: gradients + transforms only, no blur filters) ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;contain:strict;
 background:radial-gradient(1300px 820px at 12% -8%,#16267F 0%,transparent 62%),radial-gradient(900px 700px at 100% 100%,#1A0E4A 0%,transparent 60%),linear-gradient(160deg,#040920 0%,#091241 48%,#120A38 100%)}
.bg i{position:absolute;border-radius:50%;will-change:transform;transform:translateZ(0)}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-24vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(47,75,255,.55),rgba(47,75,255,0));animation:o1 40s ease-in-out infinite alternate}
.bg i:nth-child(2){width:60vmax;height:60vmax;right:-22vmax;top:-4vh;background:radial-gradient(closest-side,rgba(138,77,232,.46),rgba(138,77,232,0));animation:o2 48s ease-in-out infinite alternate}
.bg i:nth-child(3){width:60vmax;height:60vmax;left:24vw;bottom:-34vmax;background:radial-gradient(closest-side,rgba(201,162,75,.34),rgba(201,162,75,0));animation:o3 44s ease-in-out infinite alternate}
.bg i:nth-child(4){width:44vmax;height:44vmax;left:-8vw;bottom:-6vh;background:radial-gradient(closest-side,rgba(14,159,154,.3),rgba(14,159,154,0));animation:o4 52s ease-in-out infinite alternate}

 let d=cnt(p.hyps.filter(h=>h.type!=='ops'));
 if(d.n===0&&iv===0)add('demand','unknown','w_noHyp','mkt');
 else if(d.ko>0&&d.ok<=d.ko)add('demand','fragile','w_ko','mkt');
 else if(d.ok>=2&&iv>=10)add('demand','solid','w_proofs','mkt');
 else add('demand','verify','w_few','mkt');
 const gm=gmOf(p);
 if(!has)add('model','unknown','w_noPrice','bud');
 else if(gm<=0)add('model','fragile','w_negM','bud');
 else if(gm<0.2)add('model','fragile','w_lowM','bud');
 else add('model','solid','w_goodM','bud');
 if(!has)add('finance','unknown','w_noPrice','bud');
 else{const c=sim(p,SC.central);
  if(c.minC<0)add('finance','fragile','w_cashNeg','bud');
  else if(c.beM===null)add('finance','verify','w_noBE','bud');
  else if(sim(p,SC.prudent).minC<0)add('finance','verify','w_prNeg','scn');
  else add('finance','solid','w_cashOk','scn')}
 d=cnt(p.hyps.filter(h=>h.type==='ops'));
 if(d.n===0)add('ops','unknown','w_noHyp','mkt');
 else if(d.ko>0&&d.ok<=d.ko)add('ops','fragile','w_ko','mkt');
 else if(d.ok===d.n)add('ops','solid','w_okAll','mkt');
 else add('ops','verify','w_few','mkt');
 if(!p.legal1)add('legal','verify','w_legal0','plan');
 else if(!p.legal2)add('legal','verify','w_legal1','plan');
 else add('legal','solid','w_legal2','plan');
 const td=today(),withDue=p.actions.filter(a=>a.due).length,late=p.actions.filter(a=>a.st!=='done'&&a.due&&a.due<td).length;
 if(late>0)add('exec','fragile','w_execLate','plan');
 else if(withDue<3)add('exec','verify','w_exec0','plan');
 else add('exec','solid','w_exec2','plan');
 const me=p.me,tg=num(me.target),ex=num(me.expenses),sv=num(me.savings);
 if(tg<=0||ex<=0)add('you','unknown','w_you0','bud');
 else if(!has)add('you','unknown','w_noPrice','bud');
 else{const rm=reachMonth(p,tg),runway=sv/ex;if(rm!==null&&runway>=rm)add('you','solid','w_youOk','bud');else add('you','fragile','w_youShort','bud')}
 return out;
}

/* ---------- chart helpers (SVG drawn to scale) ---------- */
const CW=640,CH=240,ML=56,MR=12,MT=14,MB=28;
function niceTicks(lo,hi,n){if(!(hi>lo)){hi=lo+1}const r=hi-lo,raw=r/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<=1?1:f<=2?2:f<=5?5:10)*mag;const a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,o=[];for(let v=a;v<=b+step/2;v+=step)o.push(+v.toFixed(8));return o}
function frame(lo,hi,H,bars){
 const ticks=niceTicks(lo,hi,4),y0=ticks[0],y1=ticks[ticks.length-1],pw=CW-ML-MR,ph=CH-MT-MB;
 return{ticks:ticks,y0:y0,y1:y1,pw:pw,ph:ph,H:H,
  X:i=>ML+pw*i/H,Xc:i=>ML+pw*(i-0.5)/H,Y:v=>MT+ph*(1-(v-y0)/(y1-y0)),slot:pw/H};
}
function axes(c,from){
 let s='';c.ticks.forEach(v=>{const y=c.Y(v);s+='<line class="'+(v===0?'zero':'grid')+'" x1="'+ML+'" x2="'+(CW-MR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text x="'+(ML-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+esc(cmp(v))+'</text>'});
 const step=c.H<=12?1:c.H<=24?2:3;
 for(let m=from;m<=c.H;m++){if(m%step!==0&&m!==from)continue;const x=from===0?c.X(m):c.Xc(m);s+='<text x="'+x.toFixed(1)+'" y="'+(CH-8)+'" text-anchor="middle">'+m+'</text>'}
 return s;
}
const svgOpen=(label)=>'<svg viewBox="0 0 '+CW+' '+CH+'" role="img" aria-label="'+esc(label)+'">';
const tip=(s)=>' data-tip="'+esc(s)+'"';
function hits(c,from,fn2){let s='';for(let m=from;m<=c.H;m++){const x=from===0?c.X(m)-c.slot/2:c.Xc(m)-c.slot/2;s+='<rect class="hit" x="'+Math.max(ML,x).toFixed(1)+'" y="'+MT+'" width="'+c.slot.toFixed(1)+'" height="'+c.ph+'" fill="transparent"'+tip(fn2(m))+'/>'}return s}
const mlab=m=>t('c_month_n',{n:m});
function pathOf(c,arr,from){return arr.map((v,i)=>(i?'L':'M')+(from===0?c.X(i):c.Xc(i+1)).toFixed(1)+' '+c.Y(v).toFixed(1)).join('')}

function cashSVG(s,cur){
 const lo=Math.min(0,Math.min.apply(null,s.cash)),hi=Math.max(0,Math.max.apply(null,s.cash)),c=frame(lo,hi,s.H);
 const line=pathOf(c,s.cash,0);
 let o=svgOpen(t('ch_cash'))+axes(c,0);
 o+='<path d="'+line+'L'+c.X(s.H).toFixed(1)+' '+c.Y(0).toFixed(1)+'L'+c.X(0).toFixed(1)+' '+c.Y(0).toFixed(1)+'Z" class="area"/><path d="'+line+'" class="ln l1"/>';
 const mx=c.X(s.minM),my=c.Y(s.minC),anch=mx>CW-90?'end':mx<ML+60?'start':'middle';
 o+='<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="5" class="mk"/><text class="mkl" x="'+mx.toFixed(1)+'" y="'+(s.minC<0?my+18:my-10).toFixed(1)+'" text-anchor="'+anch+'">'+esc(fmk(s.minC,cur))+'</text>';
 o+=hits(c,0,m=>mlab(m)+'\n'+t('ch_cash')+' : '+fm(s.cash[m],cur));
 return o+'</svg>';
}
function flowSVG(s,cur){
 const exp=s.rev.map((_,i)=>s.cogs[i]+s.fixed[i]+s.interest[i]+s.tax[i]);
 const c=frame(0,Math.max(1,Math.max.apply(null,s.rev.concat(exp))),s.H),bw=Math.max(2,c.slot*0.38);
 let o=svgOpen(t('ch_flow'))+axes(c,1);
 for(let m=1;m<=s.H;m++){const xc=c.Xc(m),y0=c.Y(0);
  const h1=y0-c.Y(s.rev[m-1]),h2=y0-c.Y(exp[m-1]);
  o+='<rect class="b1" x="'+(xc-bw-0.5).toFixed(1)+'" y="'+(y0-h1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h1).toFixed(1)+'" rx="1.5"/><rect class="b2" x="'+(xc+0.5).toFixed(1)+'" y="'+(y0-h2).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h2).toFixed(1)+'" rx="1.5"/>'}
 o+=hits(c,1,m=>mlab(m)+'\n'+t('ch_rev')+' : '+fm(s.rev[m-1],cur)+'\n'+t('ch_exp')+' : '+fm(exp[m-1],cur));
 return o+'</svg>';
}
function netSVG(s,cur){
 const lo=Math.min(0,Math.min.apply(null,s.net)),hi=Math.max(0,Math.max.apply(null,s.net)),c=frame(lo,hi,s.H),bw=Math.max(3,c.slot*0.62);
 let o=svgOpen(t('ch_net'))+axes(c,1);
 for(let m=1;m<=s.H;m++){const v=s.net[m-1],y=c.Y(v),y0=c.Y(0);o+='<rect class="'+(v>=0?'bp':'bn')+'" x="'+(c.Xc(m)-bw/2).toFixed(1)+'" y="'+Math.min(y,y0).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,Math.abs(y-y0)).toFixed(1)+'" rx="1.5"/>'}
 o+=hits(c,1,m=>mlab(m)+'\n'+t('ch_net')+' : '+fm(s.net[m-1],cur));
 return o+'</svg>';
}
function beSVG(s,cur){
 const c=frame(0,Math.max(1,Math.max.apply(null,s.cumRev.concat(s.cumCost))),s.H);
 let o=svgOpen(t('ch_be'))+axes(c,0);
 o+='<path d="'+pathOf(c,s.cumCost,0)+'" class="ln l2"/><path d="'+pathOf(c,s.cumRev,0)+'" class="ln l1"/>';
 if(s.crossM!==null){const m=s.crossM,x=c.X(m),y=c.Y(s.cumRev[m]);const an=x>CW-80?'end':'middle';
  o+='<line class="dash" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+y.toFixed(1)+'" y2="'+c.Y(0).toFixed(1)+'"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" class="mk"/><text class="mkl" x="'+x.toFixed(1)+'" y="'+(y-10).toFixed(1)+'" text-anchor="'+an+'">'+esc(mlab(m))+'</text>'}
 o+=hits(c,0,m=>mlab(m)+'\n'+t('ch_cumrev')+' : '+fm(s.cumRev[m],cur)+'\n'+t('ch_cumcost')+' : '+fm(s.cumCost[m],cur));
 return o+'</svg>';
}
const PAL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function costParts(p,s){
 const H=s.H,fm0=p.fixed.map(x=>({n:x.name||'—',v:(x.per==='y'?num(x.amt)/12:num(x.amt))*(num(p.scn.ff)/100)*H}));
 const parts=[{n:t('cost_cogs'),v:sum(s.cogs),c:PAL[0]}];
 fm0.filter(x=>x.v>0).slice(0,5).forEach((x,i)=>parts.push({n:x.n,v:x.v,c:PAL[i+1]}));
 const rest=fm0.filter(x=>x.v>0).slice(5).reduce((a,x)=>a+x.v,0)+sum(s.interest)+sum(s.tax);
 if(rest>0)parts.push({n:t('cost_other'),v:rest,c:'var(--muted2)'});
 return parts.filter(x=>x.v>0);
}

 '<ul class="dleg">'+parts.map(x=>'<li><i style="background:'+x.c+'"></i><span>'+esc(x.n)+'</span><b>'+pc(x.v/tot)+'</b></li>').join('')+'</ul></div>';
}
function spark(arr,w,h){

 const st=setup(p),left=st.filter(x=>!x.done).length;
 return'<div class="stack">'+(left?'<div class="card setup"><div class="setup-in"><div><h2>'+t('su_title')+'</h2><div class="steps">'+st.map(x=>'<button class="chk-b'+(x.done?' done':'')+'" data-act="tab" data-tab="bud"><span class="cb">'+(x.done?I('check'):'')+'</span>'+t(x.k)+'</button>').join('')+'</div></div><button class="btn primary" data-act="tab" data-tab="bud">'+t('su_go')+I('arrow','flip')+'</button></div></div>':'')+'<div id="ovdyn" class="stack">'+ovDyn(p)+'</div></div>';
}
function ovDyn(p){
 const s=sim(p),cur=p.cur,H=s.H;
 const empty=!hasModel(p)&&fixedMonthly(p)===0&&invTotal(p)===0;
 const tiles='<div class="kts">'+
  tile('k1',t('c_min_cash'),esc(empty?'—':fmk(s.minC,cur)),empty?'&nbsp;':esc(s.minC<0?mlab(s.minM):t('kp_cashok')),empty?'':spark(s.cash,120,34))+
  tile('k2',t('kp_rev'),esc(empty?'—':fmk(s.totRev,cur)),empty?'&nbsp;':esc(mlab(H)+' : '+fmk(s.lastRev,cur)),empty?'':spark(s.rev,120,34))+
  tile('k3',t('kp_net'),esc(empty?'—':fmk(s.totNet,cur)),empty?'&nbsp;':esc(t('kp_nm',{v:s.totRev>0?pc(s.totNet/s.totRev):'—'})),empty?'':spark(s.net,120,34))+
  tile('k4',t('c_be_month'),esc(empty?'—':(s.beM?mlab(s.beM):t('c_never'))),empty?'&nbsp;':esc(t('c_need')+' : '+(s.need>0?fmk(s.need,cur):t('c_none'))),empty?'':spark(s.cumRev.map((v,i)=>v-s.cumCost[i]),120,34))+'</div>';
 const D=diag(p);
 const diagCard='<div class="card">'+head(t('r_title'))+D.map(d=>'<div class="dimrow"><button class="lnk" data-act="tab" data-tab="'+d.tab+'">'+t('d_'+d.k)+'</button>'+pill(d.st)+'<div class="why">'+t(d.why)+'</div></div>').join('')+'<p class="hint" style="margin-top:8px">'+t('r_noscore')+'</p></div>';
 if(empty)return tiles+'<div class="gridA"><div class="card emptyc">'+I('wallet')+'<h2>'+t('ov_empty_t')+'</h2><p class="muted">'+t('ov_empty_p')+'</p><button class="btn primary" data-act="tab" data-tab="bud">'+t('su_go')+'</button></div>'+diagCard+'</div>';
 const needP=s.need>0?'<span class="pill p-fragile">'+t('c_need')+' : '+esc(fm(s.need,cur))+'</span>':'<span class="pill p-solid">'+t('kp_cashok')+'</span>';
 const next=p.actions.filter(a=>a.st!=='done').sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,4);
 const nxt='<div class="card">'+head(t('ov_next'),'<button class="btn sm ghost" data-act="tab" data-tab="plan">'+t('tab_plan')+I('arrow','flip')+'</button>')+(next.length?next.map(a=>'<div class="nrow"><span>'+esc(a.text||'—')+'</span><span class="'+(a.due&&a.due<today()?'late':'muted')+'">'+(a.due?esc(fdate(a.due)):'')+(a.due&&a.due<today()?' · '+t('a_late'):'')+'</span></div>').join(''):'<p class="muted">'+t('a_empty')+'</p>')+'</div>';
 const hy=cnt(p.hyps),iv=num(p.interviews);
 const proof='<div class="card">'+head(t('ov_proof'),'<button class="btn sm ghost" data-act="tab" data-tab="mkt">'+t('tab_mkt')+I('arrow','flip')+'</button>')+
  '<div class="prow"><span>'+t('h_interviews')+'</span><b>'+iv+' / 10</b></div><div class="bar"><i style="width:'+Math.min(100,iv*10)+'%;background:var(--c1)"></i></div>'+
  '<div class="chips2"><span class="pill p-solid">'+t('h_status_ok')+' · '+hy.ok+'</span><span class="pill p-verify">'+t('h_status_todo')+' · '+(hy.n-hy.ok-hy.ko)+'</span><span class="pill p-fragile">'+t('h_status_ko')+' · '+hy.ko+'</span></div></div>';
 return tiles+
 '<div class="gridA"><div class="card">'+head(t('ch_cash'),needP)+'<div class="chart">'+cashSVG(s,cur)+'</div><p class="axis-n">'+t('ch_month')+'</p></div>'+diagCard+'</div>'+
 '<div class="grid2"><div class="card">'+head(t('ch_flow'),'<span class="leg"><i class="lg1"></i>'+t('ch_rev')+'<i class="lg2"></i>'+t('ch_exp')+'</span>')+'<div class="chart">'+flowSVG(s,cur)+'</div><p class="axis-n">'+t('ch_month')+'</p></div>'+
 '<div class="card">'+head(t('ch_be'),'<span class="leg"><i class="lg1"></i>'+t('ch_cumrev')+'<i class="lg2"></i>'+t('ch_cumcost')+'</span>')+'<div class="chart">'+beSVG(s,cur)+'</div><p class="axis-n">'+t('ch_month')+'</p></div></div>'+
 '<div class="grid2"><div class="card">'+head(t('ch_costs'))+donutHTML(p,s)+'</div><div class="card">'+head(t('ch_net'))+'<div class="chart">'+netSVG(s,cur)+'</div><p class="axis-n">'+t('ch_month')+'</p></div></div>'+
 '<div class="grid2">'+nxt+proof+'</div>';
}

 const invT='<div class="card">'+head(t('c_invest'),addBtn('invest',t('add_row')))+'<div class="tablewrap"><table class="sheet"><thead><tr><th>'+t('col_label')+'</th><th class="n">'+t('col_amt')+'</th><th class="x"></th></tr></thead><tbody>'+
  p.invest.map((r,i)=>'<tr><td>'+cell('invest.'+i+'.name',r.name,'text',{label:t('col_label')})+'</td><td>'+cell('invest.'+i+'.amt',r.amt,'money')+'</td><td class="x">'+delBtn('invest',i)+'</td></tr>').join('')+

 const funT='<div class="card">'+head(t('b_funding'),addBtn('fund',t('add_row')))+'<div class="tablewrap"><table class="sheet"><thead><tr><th>'+t('col_label')+'</th><th class="n">'+t('col_amt')+'</th><th class="x"></th></tr></thead><tbody>'+
  p.fund.map((r,i)=>'<tr><td>'+cell('fund.'+i+'.name',r.name,'text',{label:t('col_label')})+'</td><td>'+cell('fund.'+i+'.amt',r.amt,'money')+'</td><td class="x">'+delBtn('fund',i)+'</td></tr>').join('')+

 const me=p.me,dep=depLevel(me);
 const you='<div class="card">'+head(t('st4'))+'<div class="grid3">'+

  '<div class="kvs"><div><span>'+t('y_runway')+'</span><b class="calc" data-calc="runway"></b></div><div><span>'+t('y_reach')+'</span><b class="calc" data-calc="reach"></b></div></div>'+
  '<div class="quads">'+['E','S','D','I'].map(q=>'<button class="quad" data-act="quad" data-v="'+q+'" aria-pressed="'+(me.quad===q)+'"><span class="big">'+q+'</span><b>'+t('y_'+q)+'</b></button>').join('')+'</div>'+

 const lchT='<div class="card">'+head(t('b_launch'))+'<div class="grid2"><div class="field"><label>'+t('b_launch_l')+'</label>'+cell('launch',p.launch,'int')+'</div></div><p class="hint">'+t('b_launch_h')+'</p></div>';
 return'<div class="split"><div class="stack">'+lchT+revT+fixT+invT+funT+you+'</div><aside class="bsum" id="bsum"></aside></div>';

function depLevel(me){if(me.q1==null&&me.q2==null&&me.q3==null)return null;const y=[me.q1,me.q2,me.q3].filter(Boolean).length;return y===0?'hi':y===3?'lo':'mid'}
function calcVal(p,k){
 const cur=p.cur,H=H_(p),a=k.split(':');
 switch(a[0]){
 case'rvh':{const r=p.rev[+a[1]];return r?fm(num(r.qty)*Math.pow(1+num(r.g)/100,H-1)*num(r.price),cur):''}
 case'rvhT':return fm(sum(p.rev.map(r=>num(r.qty)*Math.pow(1+num(r.g)/100,H-1)*num(r.price))),cur);
 case'fxT':return fm(fixedMonthly(p),cur);
 case'invT':return fm(invTotal(p),cur);
 case'fundT':return fm(ownTotal(p)+num(p.loan.amt),cur);
 case'pay':return fm(loanPay(p),cur);
 case'runway':{const e=num(p.me.expenses);return e>0?t('y_months',{n:fn(num(p.me.savings)/e,1)}):'—'}
 case'reach':{const tg=num(p.me.target);if(tg<=0||!hasModel(p))return'—';const m=reachMonth(p,tg);return m?mlab(m):t('c_never')}
 }return'';
}
function bsumHTML(p){
 const s=sim(p),cur=p.cur,H=s.H,empty=!hasModel(p)&&fixedMonthly(p)===0&&invTotal(p)===0;

}

const SLIDERS=[['pf','sc_price',70,130,'%'],['vf','sc_vol',40,160,'%'],['cf','sc_cost',70,150,'%'],['ff','sc_fixed',70,150,'%'],['delay','sc_delay',0,6,'m']];
function slVal(p,k,u){const v=num(p.scn[k]);return u==='m'?(v>0?'+':'')+v+' '+t('unit_m'):(v>=100?'+':'')+(v-100)+' %'}
function totWith(p,mod){return sim(p,Object.assign({},p.scn,mod)).totNet}
function scDyn(p){
 const cur=p.cur,base=sim(p),keys=['prudent','central','ambitious'],col={prudent:'l2',central:'l1',ambitious:'l3'};
 const sims=keys.map(k=>sim(p,SC[k]));
 const lo=Math.min(0,Math.min.apply(null,sims.map(s=>Math.min.apply(null,s.cash)))),hi=Math.max(1,Math.max.apply(null,sims.map(s=>Math.max.apply(null,s.cash)))),H=base.H,c=frame(lo,hi,H);
 let svg=svgOpen(t('sc_compare'))+axes(c,0);
 sims.forEach((s,i)=>{svg+='<path d="'+pathOf(c,s.cash,0)+'" class="ln '+col[keys[i]]+(keys[i]==='prudent'?' dsh':'')+'"/>'});
 svg+=hits(c,0,m=>mlab(m)+'\n'+keys.map((k,i)=>t('c_'+k)+' : '+fm(sims[i].cash[m],cur)).join('\n'))+'</svg>';
 const table='<div class="tablewrap"><table class="sheet cmp"><thead><tr><th>'+t('c_scn')+'</th><th class="n">'+t('c_min_cash')+'</th><th class="n">'+t('kp_net')+'</th><th class="n">'+t('c_be_month')+'</th><th class="n">'+t('c_need')+'</th></tr></thead><tbody>'+keys.map((k,i)=>{const s=sims[i];return'<tr><td><i class="sw '+col[k]+'"></i>'+t('c_'+k)+'</td><td class="n'+(s.minC<0?' neg':'')+'">'+esc(fm(s.minC,cur))+'</td><td class="n'+(s.totNet<0?' neg':'')+'">'+esc(fm(s.totNet,cur))+'</td><td class="n">'+(s.beM?esc(mlab(s.beM)):'—')+'</td><td class="n">'+(s.need>0?esc(fm(s.need,cur)):t('c_none'))+'</td></tr>'}).join('')+'</tbody></table></div>';
 const bt=base.totNet,sens=[['c_sens_price',{pf:num(p.scn.pf)*0.9}],['c_sens_var',{cf:num(p.scn.cf)*1.1}],['c_sens_fixed',{ff:num(p.scn.ff)*1.1}],['c_sens_vol',{vf:num(p.scn.vf)*0.9}]].map(x=>({k:x[0],d:totWith(p,x[1])-bt}));
 const mx=Math.max.apply(null,sens.map(x=>Math.abs(x.d)).concat([1]));
 const tor='<div class="sens">'+sens.sort((a,b)=>a.d-b.d).map(x=>'<div class="sens-row"><span>'+t(x.k)+'</span><div class="bar"><i style="width:'+(100*Math.abs(x.d)/mx).toFixed(1)+'%"></i></div><b class="'+(x.d<0?'neg':'')+'">'+esc(fm(x.d,cur))+'</b></div>').join('')+'</div>';
 return'<div class="card">'+head(t('sc_compare'),'<span class="leg"><i class="lg2"></i>'+t('c_prudent')+'<i class="lg1"></i>'+t('c_central')+'<i class="lg3"></i>'+t('c_ambitious')+'</span>')+'<div class="chart">'+svg+'</div><p class="axis-n">'+t('ch_month')+' · '+t('ch_cash')+'</p>'+table+'</div>'+
 '<div class="card">'+head(t('c_sens'))+tor+'<p class="hint" style="margin-top:8px">'+t('c_sens_h')+'</p></div>';
}

/* ====== SIMULATEUR DE MARCHÉ : moteur ======
   Pur et déterministe : (cfg, état, décisions, monde) -> nouvel état.
   Le "monde" (chocs, bruit de demande) ne dépend que de la graine : mêmes chocs quoi que tu décides,
   donc on peut rejouer, comparer à un plan passif, et mesurer la part de chance. */
const GM={BETA:3.0,GAMMA:2.0,ALPHA:1.3,AW0:0.4,Q0:0.5,NMC:300,STOCK0:1.3,
 SEASON:[0.97,0.95,0.98,1,1,0.98,0.98,1,1.03,1.03,1.06,1.12],
 DIFF:{calm:{f:0.5,s:0.75,n:0.7},real:{f:1,s:1,n:1},hard:{f:1.4,s:1.3,n:1.4}},
 /* k: S=immédiat, R=annonce (confirmée au mois suivant avec proba p), C=choix à faire ; w=poids ; cd=délai mini avant répétition */
 EV:{fuel:{k:'S',w:3,cd:6},fx:{k:'S',w:2,cd:8},supplier:{k:'S',w:2.5,cd:4},pwar:{k:'S',w:2.5,cd:4},
  entrant:{k:'S',w:2,cd:99,once:1,min:3},crisis:{k:'R',w:2,cd:9,p:0.65},season:{k:'R',w:2.5,cd:5,p:1},
  tax:{k:'R',w:1.5,cd:12,p:0.55,once:1},viral:{k:'S',w:1.2,cd:6},recall:{k:'S',w:1.2,cd:6},strike:{k:'S',w:1.5,cd:5},
  credit:{k:'S',w:1.5,cd:8},latepay:{k:'S',w:1.5,cd:5},infl:{k:'S',w:1.5,cd:8},exit:{k:'S',w:0.8,cd:99,once:1,min:2},
  bulk:{k:'C',w:2.5,cd:4},bigcl:{k:'C',w:2.5,cd:4},fair:{k:'C',w:2,cd:5}},
 TONE:{viral:'good',season:'good',exit:'good',bulk:'ch',bigcl:'ch',fair:'ch'}};
const mg=(lo,hi,s)=>lo+(hi-lo)*s;
function gmRng(a){a=(a>>>0)||1;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gmClamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- le monde : calendrier des chocs + bruit, fonction de la seule graine ---------- */
function gmWorld(seed,T,diff,nP){
 const R=gmRng(seed*7919+13),D=GM.DIFF[diff]||GM.DIFF.real,ev=[],noise=[],last={},used={};
 for(let t=1;t<=T;t++){
  const list=[];let n=R()<0.45*D.f?(R()<0.18*D.f?2:1):0,hasC=false;
  for(let k=0;k<n;k++){
   const pool=Object.keys(GM.EV).filter(id=>{const e=GM.EV[id];
    if(e.once&&used[id])return false;if(last[id]&&t-last[id]<e.cd)return false;
    if(e.k==='C'&&(hasC||t>=T))return false;if(e.k==='R'&&t>=T)return false;
    if(e.min&&(t<e.min||t>T-2))return false;if(list.some(x=>x.type===id))return false;return true});
   if(!pool.length)break;
   let r=R()*sum(pool.map(id=>GM.EV[id].w)),pick=pool[0];
   for(let q=0;q<pool.length;q++){r-=GM.EV[pool[q]].w;if(r<=0){pick=pool[q];break}}
   const e=GM.EV[pick];list.push({type:pick,k:e.k,sev:Math.min(1,R()*D.s),roll:R()});
   if(e.k==='C')hasC=true;last[pick]=t;used[pick]=1;
  }
  ev.push(list);
  noise.push(Array.from({length:nP},()=>1+(R()+R()+R()-1.5)*0.14*D.n));
 }
 return{seed:seed,T:T,ev:ev,noise:noise};
}
function gmCalm(T,nP){return{seed:0,T:T,ev:Array.from({length:T},()=>[]),noise:Array.from({length:T},()=>Array(nP).fill(1))}}

/* ---------- configuration figée au départ, à partir du plan ---------- */
function gmCfg(p,o){
 const s=sim(p,SC.central);
 const prods=p.rev.filter(l=>num(l.price)>0&&num(l.qty)>0).map(l=>({name:l.name||'—',ref:num(l.price),uc:num(l.ucost),q0:num(l.qty),g:gmClamp(num(l.g)/100,-0.05,0.15)}));
 const s0=gmClamp(num(o.share0)/100,0.02,0.4)||0.12;
 const baseRev=sum(prods.map(x=>x.q0*x.ref)),baseCogs=sum(prods.map(x=>x.q0*x.uc)),fixed=fixedMonthly(p);
 const comps=[{id:'leader',base:1.06,idx:1.06,q:0.7,aw:0.65,rho:0.2,floor:0.82},{id:'disc',base:0.86,idx:0.86,q:0.35,aw:0.45,rho:0.55,floor:0.72}];
 let sc=0;comps.forEach(c=>{sc+=Math.exp(-GM.BETA*Math.log(c.idx)+GM.GAMMA*(c.q-GM.Q0)+GM.ALPHA*(c.aw-GM.AW0))});
 const X=s0*(1+sc)/(1-s0);
 const La=num(p.loan.amt),n=Math.round(num(p.loan.months));
 const T=gmClamp(Math.round(num(o.T))||12,3,36);
 const d=new Date();
 return{v:1,T:T,diff:o.diff||'real',seed:Math.round(num(o.seed))||1,cur:p.cur,
  prods:prods.map(x=>Object.assign({M0:x.q0/s0},x)),s0:s0,c:Math.log(X),comps:comps,
  cash0:s.start,fixed:fixed,tax:num(p.tax)/100,
  loan:{bal0:La,n:n,r:num(p.loan.rate)/1200,pay:loanPay(p)},
  lim:Math.round(1.5*(fixed+baseCogs)),lrate:num(o.lrate)>0?num(o.lrate):24,
  cr:gmClamp(num(o.cr)/100,0,0.9),hold:Math.max(0,num(o.hold))/100,
  mktRef:0.06*baseRev,qRef:0.04*baseRev,baseRev:baseRev,baseCogs:baseCogs,m0:(d.getMonth()+1)%12,
  plan:s.cash.slice(0,T+1),planNet:s.net.slice(0,T),planRev:s.rev.slice(0,T),
  V0:s.start+GM.STOCK0*baseCogs};
}

  stock:{u:cfg.prods.map(x=>GM.STOCK0*x.q0),v:cfg.prods.map(x=>GM.STOCK0*x.q0*x.uc)},inb:{u:z(),v:z()},
  comps:cfg.comps.map(c=>Object.assign({on:true},c)),fx:[],pend:[],news:[],choices:[],cumPre:0,taxPaid:0,bad:0,oneOff:0,
